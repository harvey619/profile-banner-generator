name: Generate Contribution Snake

on:
  schedule:
    # every 12 hours; GitHub queues cron on shared runners, so treat the
    # time as approximate rather than exact
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      # required for the action to push the generated SVGs to the output branch
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#2d3343,#3b2f63,#5b3fa8,#7C3AED,#A78BFA
            dist/snake-light.svg?color_snake=#0891B2&color_dots=#ebedf0,#d8c9f5,#b79ceb,#8f5fe0,#7C3AED

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
